# Release: on a v* tag, build portable archives for each platform and attach
# them to a GitHub release. Archives are the `make install` layout
# (bin/cljc + share/cljc/...), so exe-relative sharedir resolution makes them
# runnable from any unpack location; Windows ships a flat dir (exe-dir is on
# the load path).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
          make test-full
      - name: Package
        run: |
          D=cljc-${GITHUB_REF_NAME}-linux-x86_64
          make install PREFIX=/ DESTDIR="$PWD/$D"
          cp README.md CHANGELOG.md "$D/"
          tar czf "$D.tar.gz" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (arm64) + smoke
        run: |
          make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
          ./cljc -e '(println :ok)'
      - name: Package arm64
        run: |
          D=cljc-${GITHUB_REF_NAME}-macos-arm64
          make install PREFIX=/ DESTDIR="$PWD/$D"
          cp README.md CHANGELOG.md "$D/"
          tar czf "$D.tar.gz" "$D"
      - name: Build + package x86_64
        run: |
          cc -arch x86_64 -O2 -Wall -Wextra -Werror \
             -Wno-unused-parameter -Wno-unused-function \
             -DCLJC_SHAREDIR='"/usr/local/share/cljc"' \
             -o cljc cljc.c -lm -ldl
          D=cljc-${GITHUB_REF_NAME}-macos-x86_64
          make install PREFIX=/ DESTDIR="$PWD/$D"
          cp README.md CHANGELOG.md "$D/"
          tar czf "$D.tar.gz" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.tar.gz"

  windows:
    # cross-compile from Linux: mingw-w64 is verified to build cljc.exe, and
    # the CI matrix already runs the suite on a real Windows runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Build
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wno-unused-parameter -Wno-unused-function \
            -DCLJC_SHAREDIR='"c:/cljc"' -o cljc.exe cljc.c -lm -lws2_32
      - name: Package (flat dir — exe-dir is on the load path)
        run: |
          D=cljc-${GITHUB_REF_NAME}-windows-x86_64
          mkdir "$D"
          cp cljc.exe cljc.c README.md CHANGELOG.md "$D/"
          cp docs.clj libc.clj json.clj fs.clj process.clj test.clj jit.clj \
             bundle.clj clerk.clj judge.cljc csp.clj http.clj nrepl.clj "$D/"
          cp -r vendor "$D/vendor"
          zip -qr "$D.zip" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cljc $GITHUB_REF_NAME" \
            --generate-notes \
            *.tar.gz *.zip
