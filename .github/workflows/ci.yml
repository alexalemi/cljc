# CI: build + full regression suite on every platform cljc claims to support.
# The suite self-skips platform-dependent sections (see the capability probes
# at the top of tests.clj), so one tests.clj runs everywhere.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (zero warnings enforced)
        run: make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
      - name: Test (normal + GC stress)
        run: make test

  linux-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan/UBSan
        run: cc -g -fsanitize=address,undefined -o cljc-asan cljc.c -lm -ldl
      - name: Test under sanitizers
        env:
          # conservative stack scanning reads the whole stack range and never
          # frees pool blocks — leak/UAR checkers must be off (same as Boehm)
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
        run: |
          ./cljc-asan tests.clj > out.txt 2>&1
          ! grep -E 'FAIL|error|ERROR|runtime error' out.txt
          grep -q PASS out.txt

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (zero warnings enforced)
        run: make CFLAGS='-O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function'
      - name: Timing probe
        run: |
          time ./cljc -e '(Thread/sleep 100)'
          time ./cljc -e '(let [f1 (future (Thread/sleep 50)) f2 (future (Thread/sleep 50))] @f1 @f2 (println :ok))'
      - name: Test (normal)
        env:
          CLJC_UNBUFFERED: "1"
        run: |
          rc=0; time ./cljc tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc, PASS count: $(grep -c PASS out.txt)"
          if grep -inE 'fail|error' out.txt; then tail -30 out.txt; exit 1; fi
          exit $rc
      - name: Test (GC stress)
        run: |
          rc=0; CLJC_GC_STRESS=1 ./cljc tests.clj > out2.txt 2>&1 || rc=$?
          if grep -inE 'fail|error' out2.txt; then tail -30 out2.txt; exit 1; fi
          exit $rc

  # Intel coverage without an Intel runner: build the x86_64 slice on the
  # arm64 runner and run the suite under Rosetta 2.
  macos-x86_64-rosetta:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta 2 (usually preinstalled)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Build x86_64 slice
        run: |
          cc -arch x86_64 -O2 -Wall -Wextra -Werror \
             -Wno-unused-parameter -Wno-unused-function \
             -DCLJC_SHAREDIR='"/usr/local/share/cljc"' \
             -o cljc cljc.c -lm -ldl
          file cljc
      - name: Test under Rosetta
        env:
          CLJC_UNBUFFERED: "1"
          # FFI glue must match the emulated arch, not the host's
          CLJC_CC: "cc -arch x86_64"
        run: |
          rc=0; ./cljc tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc, PASS count: $(grep -c PASS out.txt)"
          [ $rc -ne 0 ] && tail -40 out.txt
          if grep -inE 'fail|error' out.txt; then tail -30 out.txt; exit 1; fi
          grep -q PASS out.txt
          exit $rc

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build (zero warnings enforced)
        run: |
          gcc -O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-function \
              -static -o cljc.exe cljc.c -lm -lws2_32
      - name: Smoke test
        run: |
          ls -la cljc.exe
          ./cljc.exe -e '(println :hello-windows)' || { echo "launch rc=$?"; exit 1; }
      - name: Test (platform-dependent sections self-skip)
        env:
          CLJC_UNBUFFERED: "1"
        run: |
          rc=0; ./cljc.exe tests.clj > out.txt 2>&1 || rc=$?
          echo "suite rc=$rc, PASS count: $(grep -c PASS out.txt), lines: $(wc -l < out.txt)"
          tail -3 out.txt
          if grep -inE 'fail|error' out.txt; then exit 1; fi
          grep -q PASS out.txt
          grep SKIP out.txt
          exit $rc
      - name: Test (GC stress)
        env:
          CLJC_UNBUFFERED: "1"
        run: |
          rc=0; CLJC_GC_STRESS=1 ./cljc.exe tests.clj > out2.txt 2>&1 || rc=$?
          tail -3 out2.txt
          if grep -inE 'fail|error' out2.txt; then exit 1; fi
          grep -q PASS out2.txt
          exit $rc
